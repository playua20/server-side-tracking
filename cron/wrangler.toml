name = "track-demo-keepalive"
main = "keepalive.js"
compatibility_date = "2026-09-01"

# 06:10 UTC on the 1st, 4th, 7th … of each month — every 3 days, with a wide
# margin against Supabase's 7-day inactivity window. Cloudflare's free plan
# allows any cron expression, unlike Vercel Hobby's daily-only schedule.
[triggers]
crons = ["10 6 */3 * *"]

# No KV, no secrets, no bindings: the worker only needs to make one fetch.
[observability]
enabled = true
