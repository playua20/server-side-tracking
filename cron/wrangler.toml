name = "track-demo-keepalive"
main = "keepalive.js"
compatibility_date = "2026-09-01"

# Every 15 min: sweep failed CAPI deliveries. Every 3 days: keep the Supabase
# project awake, with a wide margin against its 7-day inactivity window.
# Cloudflare's free plan allows any cron expression, unlike Vercel Hobby's
# daily-only schedule — which is also why the cron lives here.
[triggers]
crons = ["*/15 * * * *", "10 6 */3 * *"]

# One secret, set out of band: npx wrangler secret put CRON_TOKEN
[observability]
enabled = true
